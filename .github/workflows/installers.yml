name: Installers

# The Debian package and the Windows installer of Contorno Indicator. The
# release workflow starts this one on every new tag; on a tag both files are
# attached to that tag's release under fixed names, so
# https://github.com/medaminben/Contorno/releases/latest/download/<name>
# always serves the newest stable one. Started by hand on a branch, it only
# keeps them as workflow artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: model
          key: isnet-${{ hashFiles('docs/articles/contorno-area-measurement/scripts/model/*', 'cmake/RunIsnetExport.cmake') }}
      - name: Export the IS-Net model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          s=docs/articles/contorno-area-measurement/scripts/model
          cmake -DPYTHON=python3 -DVENV_DIR="$RUNNER_TEMP/venv" -DWORK_DIR="$RUNNER_TEMP/work" \
            -DSCRIPT=$s/export_isnet.py -DREQUIREMENTS=$s/requirements.txt \
            -DOUT="$PWD/model/isnet-general-use.pt" -DCHECK=docs/samples/leather/calf_black.jpg \
            -P cmake/RunIsnetExport.cmake
          test -f model/isnet-general-use.pt
      - uses: actions/upload-artifact@v4
        with:
          name: isnet-model
          path: model/isnet-general-use.pt
          retention-days: 1

  debian:
    needs: model
    runs-on: ubuntu-latest
    # built on Debian 13 so the package depends on its wxWidgets and OpenCV
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ cmake ninja-build \
            pkg-config libwxgtk3.2-dev libgtk-3-dev libopencv-dev wx3.2-i18n gettext \
            librsvg2-bin python3 dpkg-dev file
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: isnet-model
          path: model
      - name: Build the package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake --preset deb -DCONTORNO_ISNET_MODEL="$PWD/model/isnet-general-use.pt"
          cmake --build --preset deb
          (cd build/deb && cpack)
          cp build/deb/contorno-indicator_*_amd64.deb contorno-indicator_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: debian
          path: contorno-indicator_amd64.deb
      # The installed package, with the checkout moved away: a file the program still reads from
      # the source tree fails here, not on a user's machine. 77: no LibTorch in this build.
      - name: Install the package and self-test it
        working-directory: /tmp
        run: |
          apt-get install -y --no-install-recommends "$GITHUB_WORKSPACE/contorno-indicator_amd64.deb" xvfb xauth
          mv "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE.hidden"
          code=0
          HOME=$(mktemp -d) xvfb-run -a contorno-indicator --self-test \
            /usr/share/contorno/samples/leather/calf_black.jpg /tmp/self-test || code=$?
          mv "$GITHUB_WORKSPACE.hidden" "$GITHUB_WORKSPACE"
          test -s /usr/share/doc/contorno-indicator/copyright
          if [ "$code" -ne 0 ] && [ "$code" -ne 77 ]; then echo "self-test exit code $code"; exit 1; fi

  windows:
    needs: model
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: isnet-model
          path: model
      - id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Get vcpkg at the manifest's baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone --quiet https://github.com/microsoft/vcpkg C:\vcpkg-contorno
          git -C C:\vcpkg-contorno checkout --quiet $baseline
          & C:\vcpkg-contorno\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_INSTALLATION_ROOT=C:\vcpkg-contorno" >> $env:GITHUB_ENV
      - name: Install Ninja and Inno Setup
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure (vcpkg builds wxWidgets)
        shell: pwsh
        run: |
          $model = (Resolve-Path model/isnet-general-use.pt).Path -replace '\\', '/'
          cmake --preset windows-installer "-DCONTORNO_ISNET_MODEL=$model"
      # saved even when the build fails, so a retry does not build wxWidgets again
      - if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Build the installer
        shell: pwsh
        run: |
          cmake --build --preset windows-installer --target Indicator_installer -- -k 0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/windows-installer/dist/contorno-indicator-*-setup.exe contorno-indicator-setup.exe
      - name: Self-test the staged program
        shell: pwsh
        timeout-minutes: 10
        run: |
          # a GUI program: Start-Process waits for it and gives its exit code (77: no AI)
          $p = Start-Process build/windows-installer/stage/bin/contorno-indicator.exe -Wait -PassThru `
            -ArgumentList '--self-test', 'docs/samples/leather/calf_black.jpg', "$env:RUNNER_TEMP/self-test"
          if ($p.ExitCode -ne 0) { Write-Error "self-test exit code $($p.ExitCode)"; exit 1 }
          Get-ChildItem "$env:RUNNER_TEMP/self-test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-self-test
          path: ${{ runner.temp }}/self-test/self_test_window.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: contorno-indicator-setup.exe
      # The installer itself, then the installed program with the checkout renamed: a file the
      # program still reads from the source tree (the missing wordmark of 0.1.1) fails here.
      - name: Install and self-test the installed program
        shell: pwsh
        working-directory: ${{ runner.temp }}
        timeout-minutes: 15
        run: |
          $app = "$env:RUNNER_TEMP\installed"
          $setup = Start-Process "$env:GITHUB_WORKSPACE\contorno-indicator-setup.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=$app", "/LOG=$env:RUNNER_TEMP\setup.log"
          if ($setup.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; Write-Error "setup exit code $($setup.ExitCode)"; exit 1 }
          $data = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Contorno'
          foreach ($file in "$app\share\contorno\data-folder", "$app\share\contorno\models\isnet-general-use.pt",
                            "$data\samples\leather\calf_black.jpg", "$data\manual\index.html") {
            if (-not (Test-Path $file)) { Write-Error "not installed: $file"; exit 1 }
          }
          Rename-Item $env:GITHUB_WORKSPACE "$env:GITHUB_WORKSPACE.hidden"
          try {
            $p = Start-Process "$app\bin\contorno-indicator.exe" -Wait -PassThru `
              -ArgumentList '--self-test', "$data\samples\leather\calf_black.jpg", "$env:RUNNER_TEMP\installed-self-test"
          } finally {
            Rename-Item "$env:GITHUB_WORKSPACE.hidden" $env:GITHUB_WORKSPACE
          }
          if ($p.ExitCode -ne 0) { Write-Error "installed self-test exit code $($p.ExitCode)"; exit 1 }

  publish:
    needs: [debian, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debian
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber -R "$GITHUB_REPOSITORY"
