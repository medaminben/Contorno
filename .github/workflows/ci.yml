name: CI

on:
  push:
    branches: [main, Beta]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: medaminben/buildkit/.github/workflows/ci.yml@v2.0.0
    permissions:
      contents: read
    with:
      presets: "ci"
      apt-packages: "libwxgtk3.2-dev libopencv-dev gettext python3-venv fonts-noto-core locales-all"
      xvfb: true
      timeout-minutes: 90
