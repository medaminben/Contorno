<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" font-family="DejaVu Sans, sans-serif">
  <style>
    .box { fill: #fff; stroke: #1a1d1a; stroke-width: 1.2; }
    .ui { fill: #f3f5f3; stroke: #127a3a; stroke-width: 1.6; }
    .t { font-size: 13px; fill: #1a1d1a; }
    .s { font-size: 11px; fill: #5d665f; }
    .a { stroke: #127a3a; stroke-width: 1.4; fill: none; }
  </style>
  <rect class="ui" x="70" y="8" width="300" height="52"/>
  <text class="t" x="220" y="30" text-anchor="middle">indicator_ui</text>
  <text class="s" x="220" y="48" text-anchor="middle">wxWidgets 3.2 windows, drawn keys and readout</text>
  <line class="a" x1="220" y1="60" x2="220" y2="82"/>
  <polygon points="220,88 215,78 225,78" fill="#127a3a"/>
  <rect class="box" x="70" y="88" width="300" height="52"/>
  <text class="t" x="220" y="110" text-anchor="middle">indicator_model</text>
  <text class="s" x="220" y="128" text-anchor="middle">C++20, no Qt and no wxWidgets header</text>
  <line class="a" x1="220" y1="140" x2="220" y2="162"/>
  <polygon points="220,168 215,158 225,158" fill="#127a3a"/>
  <rect class="box" x="16" y="168" width="128" height="56"/>
  <text class="t" x="80" y="192" text-anchor="middle">Inspection</text>
  <text class="s" x="80" y="208" text-anchor="middle">zip schema</text>
  <rect class="box" x="156" y="168" width="128" height="56"/>
  <text class="t" x="220" y="192" text-anchor="middle">Vision</text>
  <text class="s" x="220" y="208" text-anchor="middle">camera, outline, area</text>
  <rect class="box" x="296" y="168" width="128" height="56"/>
  <text class="t" x="360" y="192" text-anchor="middle">Tools</text>
  <text class="s" x="360" y="208" text-anchor="middle">zip, JSON, DXF</text>
  <line class="a" x1="220" y1="224" x2="220" y2="252"/>
  <polygon points="220,258 215,248 225,248" fill="#127a3a"/>
  <rect class="box" x="110" y="258" width="220" height="44"/>
  <text class="t" x="220" y="284" text-anchor="middle">Pot, integer polygon grid</text>
  <line class="a" x1="220" y1="302" x2="220" y2="324"/>
  <polygon points="220,330 215,320 225,320" fill="#127a3a"/>
  <rect class="box" x="110" y="330" width="220" height="44"/>
  <text class="t" x="220" y="356" text-anchor="middle">Core, Result and Problem</text>
  <rect class="box" x="70" y="404" width="300" height="52"/>
  <text class="t" x="220" y="426" text-anchor="middle">OpenCV and LibTorch</text>
  <text class="s" x="220" y="444" text-anchor="middle">private to Vision; absent from public headers</text>
  <line class="a" x1="220" y1="374" x2="220" y2="400" stroke-dasharray="4 3"/>
  <text class="s" x="228" y="392">private</text>
</svg>
