<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 640" font-family="DejaVu Sans, sans-serif">
  <style>
    .box { fill: #fff; stroke: #1a1d1a; stroke-width: 1.2; }
    .app { fill: #f3f5f3; stroke: #127a3a; stroke-width: 1.6; }
    .t { font-size: 13px; fill: #1a1d1a; }
    .s { font-size: 11px; fill: #5d665f; }
    .a { stroke: #127a3a; stroke-width: 1.4; fill: none; }
  </style>
  <rect class="box" x="90" y="8" width="260" height="40"/>
  <text class="t" x="220" y="33" text-anchor="middle">Photo file and its EXIF</text>
  <line class="a" x1="220" y1="48" x2="220" y2="64"/>
  <polygon points="220,70 215,60 225,60" fill="#127a3a"/>
  <rect class="box" x="90" y="70" width="260" height="40"/>
  <text class="t" x="220" y="95" text-anchor="middle">parse_photo_metadata</text>
  <line class="a" x1="220" y1="110" x2="220" y2="126"/>
  <polygon points="220,132 215,122 225,122" fill="#127a3a"/>
  <rect class="box" x="90" y="132" width="260" height="48"/>
  <text class="t" x="220" y="152" text-anchor="middle">resolve_camera</text>
  <text class="s" x="220" y="168" text-anchor="middle">photo where valid, else the Set Up values</text>
  <line class="a" x1="220" y1="180" x2="220" y2="196"/>
  <polygon points="220,202 215,192 225,192" fill="#127a3a"/>
  <rect class="box" x="90" y="202" width="260" height="40"/>
  <text class="t" x="220" y="227" text-anchor="middle">lens_scale, mm per pixel</text>
  <line class="a" x1="220" y1="242" x2="220" y2="258"/>
  <polygon points="220,264 215,254 225,254" fill="#127a3a"/>
  <rect class="app" x="50" y="264" width="340" height="44"/>
  <text class="t" x="220" y="291" text-anchor="middle">find_objects, on the worker thread</text>
  <line class="a" x1="140" y1="308" x2="140" y2="330"/>
  <polygon points="140,336 135,326 145,326" fill="#127a3a"/>
  <line class="a" x1="300" y1="308" x2="300" y2="330"/>
  <polygon points="300,336 295,326 305,326" fill="#127a3a"/>
  <rect class="box" x="16" y="336" width="210" height="56"/>
  <text class="t" x="121" y="358" text-anchor="middle">IS-Net, 1024 x 1024</text>
  <text class="s" x="121" y="376" text-anchor="middle">probability, then a region</text>
  <rect class="box" x="234" y="336" width="190" height="56"/>
  <text class="t" x="329" y="358" text-anchor="middle">Background object</text>
  <text class="s" x="329" y="376" text-anchor="middle">border, then watershed</text>
  <line class="a" x1="121" y1="392" x2="200" y2="424"/>
  <line class="a" x1="329" y1="392" x2="250" y2="424"/>
  <polygon points="220,436 215,426 225,426" fill="#127a3a"/>
  <rect class="box" x="40" y="436" width="360" height="48"/>
  <text class="t" x="220" y="456" text-anchor="middle">Replace the model region only if</text>
  <text class="s" x="220" y="472" text-anchor="middle">the background object holds 95% or more and is over 10% larger</text>
  <line class="a" x1="220" y1="484" x2="220" y2="506"/>
  <polygon points="220,512 215,502 225,502" fill="#127a3a"/>
  <rect class="box" x="70" y="512" width="300" height="48"/>
  <text class="t" x="220" y="532" text-anchor="middle">Mask, outline, area</text>
  <text class="s" x="220" y="548" text-anchor="middle">area = white pixels x s_x x s_y</text>
  <line class="a" x1="220" y1="560" x2="220" y2="582"/>
  <polygon points="220,588 215,578 225,578" fill="#127a3a"/>
  <rect class="app" x="70" y="588" width="300" height="36"/>
  <text class="t" x="220" y="611" text-anchor="middle">Readout, and the inspection zip on Save</text>
</svg>
